<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <h2 class="text-center mb-4 text-primary fw-bold">Inventory Management</h2>

    <!-- 🔍 SEARCH BAR -->
    <form method="get" action="/inventory" class="mb-4">
        <div class="input-group">
            <input type="text" name="search" class="form-control"
                   placeholder="Search product by name..."
                   th:value="${searchQuery}">
            <button class="btn btn-primary">Search</button>
            <a href="/inventory" class="btn btn-secondary">Reset</a>
        </div>
    </form>

    <!-- Add Product Card -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            Add New Product
        </div>

        <div class="card-body">

            <form action="/addProduct" method="post" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Product Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Purchase Date</label>
                    <input type="date" name="purchaseDate" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Quantity</label>
                    <input type="number" name="quantity" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Price Per Unit</label>
                    <input type="number" step="0.01" name="pricePerUnit" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Minimum Stock Level</label>
                    <input type="number" name="minStockLevel" class="form-control" required>
                </div>

                <div class="col-12 text-end">
                    <button class="btn btn-success">Add Product</button>
                </div>

            </form>
        </div>
    </div>

    <!-- Product Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            Product List
        </div>

        <div class="card-body p-0">

            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Purchase Date</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Min Stock</th>
                    <th>Status</th>
                    <th width="170px">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.purchaseDate}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td th:text="${p.pricePerUnit}"></td>
                    <td th:text="${p.minStockLevel}"></td>

                    <td>
                        <span th:if="${p.quantity < p.minStockLevel}" class="badge bg-danger">Low Stock</span>
                        <span th:if="${p.quantity >= p.minStockLevel}" class="badge bg-success">OK</span>
                    </td>

                    <td>
                        <a th:href="@{/increaseStock(id=${p.id})}" class="btn btn-sm btn-outline-success">+</a>
                        <a th:href="@{/decreaseStock(id=${p.id})}" class="btn btn-sm btn-outline-warning">-</a>
                        <a th:href="@{/editProduct(id=${p.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a th:href="@{/deleteProduct(id=${p.id})}"
                           onclick="return confirm('Are you sure?');"
                           class="btn btn-sm btn-outline-danger">Delete</a>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
