<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Vyapari ERP</a>

        <div>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center fw-bold text-primary mb-4">
        Welcome to Vyapari Inventory Dashboard
    </h2>

    <!-- Dashboard Options -->
    <div class="row g-4">

        <!-- Inventory Card -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center">
                    <h5 class="card-title fw-bold">Inventory Management</h5>
                    <p class="text-muted">Add, view, edit and manage all stock easily.</p>
                    <a href="/inventory" class="btn btn-primary w-100">Go to Inventory</a>
                </div>
            </div>
        </div>

        <!-- Low Stock Alert -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center">
                    <h5 class="card-title fw-bold">Low Stock Report</h5>
                    <p class="text-muted">Check items that need immediate restocking.</p>
                    <a href="/inventory" class="btn btn-warning w-100">View Low Stock</a>
                </div>
            </div>
        </div>

        <!-- Future Features -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center">
                    <h5 class="card-title fw-bold">Reports & Analytics</h5>
                    <p class="text-muted">Download and view future reporting features.</p>
                    <button class="btn btn-secondary w-100" disabled>Coming Soon</button>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
