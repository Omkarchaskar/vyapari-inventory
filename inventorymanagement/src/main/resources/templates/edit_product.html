<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white text-center">
            <h4>Edit Product</h4>
        </div>

        <div class="card-body">

            <form action="/updateProduct" method="post" class="row g-3">

                <!-- Hidden ID -->
                <input type="hidden" name="id" th:value="${product.id}">

                <div class="col-12">
                    <label class="form-label fw-semibold">Product Name</label>
                    <input type="text" name="name" th:value="${product.name}" class="form-control" required>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Purchase Date</label>
                    <input type="date" name="purchaseDate" th:value="${product.purchaseDate}" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Quantity</label>
                    <input type="number" name="quantity" th:value="${product.quantity}" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Price Per Unit</label>
                    <input type="number" step="0.01" name="pricePerUnit" th:value="${product.pricePerUnit}" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Minimum Stock Level</label>
                    <input type="number" name="minStockLevel" th:value="${product.minStockLevel}" class="form-control" required>
                </div>

                <div class="col-12 text-end mt-3">
                    <button class="btn btn-primary">
                        Update Product
                    </button>
                </div>

            </form>

        </div>
    </div>

    <div class="text-center mt-3">
        <a href="/inventory" class="btn btn-secondary">Back to Inventory</a>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
